[project]
name = "copyback"
version = "0.1.0"
description = "Reverse-sync tool for Copier templates — push project changes back to the template"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ethan Fremen", email = "ethan@mindlace.net" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
copyback = "copyback.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
